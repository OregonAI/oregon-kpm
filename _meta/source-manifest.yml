note: "Every upstream source this corpus consumes. Human-approved via PR BEFORE any\ningestion. GENERATED\
  \ by src/enumerate_kpm.py — do not hand-edit; re-run it.\n\nSource: the /lfo/APPR document library behind\
  \ oregonlegislature.gov's KPM page.\nThe library returns 401 to every anonymous LISTING api; individual\
  \ PDFs under it\nare public. Names therefore come from SharePoint's search RSS feed plus the\nSocrata\
  \ index kvbx-erfw (2016-2018 only). See src/enumerate_kpm.py.\n\nTraps recorded so a future re-enumeration\
  \ does not fall into them:\n1. NEVER construct a filename. At least six naming conventions are in live\
  \ use,\n   including agency-first prose names with spaces. The date in a name is a\n   publication date\
  \ and is not derivable.\n2. RSS links are http:// with unencoded spaces. Normalise both or every fetch\n\
  \   404s in a way that looks exactly like link rot.\n3. One search query saturates (rows at start=601,\
  \ none at start=1001), so the\n   sweep partitions by year and unions the results.\n4. `measure_status:\
  \ proposed` marks APPRProposed_ files. They are real reports,\n   not drafts to discard, and for some\
  \ agency-years they are the only file.\n5. Coverage here is a statement about OUR DISCOVERY, not about\
  \ Oregon. The KPM\n   page states its own rule: an agency missing for a year is 'non-reported'.\n"
index: https://www.oregonlegislature.gov/lfo/Pages/KPM.aspx
