# Corpus configuration — the single source of truth the toolkit reads.
corpus:
  id: "oregon-kpm"                   # = repo name, e.g. oregon-records-retention
  name: "Oregon Key Performance Measures — Annual Performance Progress Reports"
  jurisdiction: "oregon"             # e.g. oregon | oregon/marion-county | oregon/salem
  archetype: "document"              # document | api | hybrid
  # Where the OFFICIAL text lives — the ORS/OAR landing page, the SoS Archives
  # schedules page, the legislature's bill site. Emitted on every MCP response
  # (interface contract, response convention 1). Not optional in practice: the
  # disclaimer on every response tells an agent this copy is non-authoritative and to
  # "verify at source", and without this it is never told WHERE the source is. All four
  # corpora that predate this key shipped without one, and every agent asking them
  # `corpus_overview` was given that dead end. Requires corpus-toolkit >= 1.7.0;
  # corpus-validate-frontmatter warns while it is unset.
  # LFO's KPM landing page, NOT a URL under /lfo/APPR. Deliberate, and for a sharper
  # reason than "PDFs move": /lfo/APPR returns 401 to anonymous listing (verified
  # 2026-07-31 against the library root, Forms/AllItems.aspx, _api/web/lists, listdata.svc
  # and owssvr.dll). Individual PDFs under it ARE public, but pointing an agent at a
  # directory it cannot open is worse than pointing at nothing. This page is public,
  # stable, and is where a human actually goes.
  authoritative_source: "https://www.oregonlegislature.gov/lfo/Pages/KPM.aspx"
  schema_version: 1
  contract_version: 1

# One root, one doc_type. Every document here is an Annual Performance Progress Report
# (APPR) — the report an agency files with the Legislature against its legislatively
# approved Key Performance Measures.
#
# SCOPE NOTE. Both APPR_ and APPRProposed_ files are ingested under this one type. The
# proposed/approved distinction is a FRONTMATTER FIELD, not a second doc_type: it is a
# status the same document carries, and three agencies (DSL, OHA, DEQ) appear in 2024
# only as Proposed, so a type split would read as "these agencies did not report".
content_roots:                       # where document files live (document/hybrid).
                                     # jurisdiction-wide root: one doc_type for the
                                     # whole directory —
  - path: "reports"
    doc_type: "performance_report"
                                     # issuing-body-scoped root: <path>/<slug>/<subdir> —
  # - path: "agencies"
  #   scoped: true
  #   subdirs:
  #     policies: policy
  #     procedures: procedure

plugins:
  # Vector search over the prebuilt embeddings artifact. The implementation is shared --
  # corpus_toolkit.semantic.search -- rather than a per-repo copy, because eight copies of a
  # loader do not stay identical and the details that drift are the expensive ones (the
  # convert-once matmul, the dim probe that fails a mismatched model closed).
  #
  # `_meta/embeddings/` is gitignored and mounted at runtime: it is derived from the
  # documents beside it, it needs a GPU to build, and it is far too large to commit. If the
  # mount is missing the server does NOT fail -- available() returns False and search_corpus
  # serves keyword-only, silently. That is the documented sharp edge, so the compose
  # healthcheck asserts availability rather than trusting a green container.
  semantic_search_module: "corpus_toolkit.semantic.search"
  citation_module: "src.citation_schemes"      # registers `appr`, plus outbound ORS/OAR
  # snapshot_slice_module: "src.slicing:slice" # (doc_id, snapshot_id, raw_text) -> str
  # issuing_body_registry: "_meta/catalog/issuing-bodies.yml"
  # issuing_body_registry_key: "entries"       # the TOP-LEVEL KEY inside that file.
  #                                            # Defaults to "entries"; if your registry
  #                                            # is keyed differently (e.g. "organizations")
  #                                            # and you omit this, the toolkit reads an
  #                                            # EMPTY registry and silently enforces no
  #                                            # slug validation at all.
  # issuing_body_profiles: "_meta/issuing-body-profiles.yml"    # {profiles: {slug: {...}}}
  extra_schema_checks: []            # [{path: "...", schema: "..."}, ...]

# Sibling corpora this one resolves citations INTO (toolkit >= 1.1.0). Optional;
# omit entirely and resolution stays purely local, exactly as before v1.1.0.
#
# Use this instead of copying documents across corpora. A citation that resolves
# next door stays one source of truth; a copied document becomes a second one that
# drifts. `index_url` should point at an index the sibling PUBLISHES (e.g. from its
# Pages build) rather than a committed file — a committed index can fall behind its
# own corpus, and the damage lands here, as a resolution returning a stale title.
#
# Mark the matching citation schemes with register_scheme(..., corpus="<sibling id>").
siblings:
  # MEASURED before declaring, not assumed -- the standard oregon-audits set. Across the 785
  # reports: ORS 202 occurrences in 77 documents over 36 distinct sections, OAR 39
  # occurrences in 19 documents over 11 rules. Against this sibling's published index
  # (75,250 documents), 26 of 36 ORS targets resolve (72%) and 9 of 11 OAR (82%) -- 127 of
  # 202 ORS occurrences and 37 of 39 OAR.
  #
  # The unresolved remainder is ERF COVERAGE, not citations this corpus got wrong: ORS
  # 197.296-197.299 and 197A.320 (land use), 403.115/403.130 (9-1-1), 468A.205/468A.793
  # (air quality). Each begins resolving the day ERF ingests that chapter, with no change
  # here.
  #
  # THIS ENTRY IS A BUG FIX, not a new feature. src/citation_schemes.py has registered
  # `ors-section` and `oar-rule` with corpus="executive-regulatory-frameworks" since Stage 4,
  # and with no sibling declared the framework returned `available: False` for every one of
  # them -- surfacing as `sibling_unavailable`, which a caller reads as "could not check"
  # rather than "does not exist". Configuration missing behind a shipped feature is worse
  # than the feature being absent, because it looks like a working edge that finds nothing.
  - id: "executive-regulatory-frameworks"
    index_url: "https://oregonai.github.io/executive-regulatory-frameworks/corpus-index.json"
    web_base:  "https://github.com/OregonAI/executive-regulatory-frameworks/blob/main/"
# oregon-budget and oregon-audits are NOT declared, and the omission is deliberate. The join
# this corpus most wants -- dollars appropriated against outcomes reported -- matches on
# AGENCY and BIENNIUM, not on a citation string an APPR contains, so no `corpus=` scheme can
# reach it and declaring the sibling would add configuration that resolves nothing. See the
# note in src/citation_schemes.py, and _meta/agency-crosswalk.yml for the agency half.
# Declare them with the scheme, not before it.

disclaimer_marker: "NON-AUTHORITATIVE"
graph_path: "_meta/graph.json"
source_manifest_path: "_meta/source-manifest.yml"
snapshot_dir: "_meta/snapshots"

provenance:
  coverage_fail_threshold: 0.70
  coverage_warn_threshold: 0.90


mcp:
  server_name: "oregon-kpm"
  transports: [stdio, http]
  # WITHOUT THIS LIST THE SERVER DROPS THESE FIELDS ENTIRELY. `get_document` emits a fixed
  # base contract plus whatever a corpus allow-lists here (corpus_toolkit/mcp/backends.py
  # ~line 514), so until now a caller could not see the reporting year, the agency, or how
  # either was obtained -- fields `src/check_guardrails.py` makes MANDATORY on every
  # document. Required by our own rules and unreachable through the interface is the trap
  # the toolkit's own comment warns about.
  #
  # `year_source` and `text_source` are here for the same reason they exist at all: a value
  # whose provenance is invisible is a value a caller cannot weigh. Shipping
  # `agency_registry_slug` without them would put a cross-corpus link in the corpus and
  # leave it unreadable.
  extra_document_fields:
    - agency
    - agency_key
    - agency_code
    - agency_registry_slug
    - agency_registry_corpus
    - reporting_year
    - year_source
    - measure_status
    - text_source

status:
  reverify_days: 90                  # quarterly re-verification SLA
