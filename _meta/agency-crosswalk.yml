note: 'Crosswalk from this corpus''s derived agency_key to the executive-regulatory-frameworks agency
  registry slug. agency_key collapses the many ways a cover page names one agency; this maps that
  identity onto the registry that owns it. Generated and validated by src/link_agency_registry.py
  -- --check runs in CI from committed data alone, --verify-registry resolves every slug against ERF.
  An entry under `unmapped` is a DECISION with a stated reason, never a blank: "we looked and there
  is no counterpart" and "nobody has looked yet" must not be the same state. Many keys mapping to
  one slug is expected and correct -- an agency that renamed itself appears under both names across
  thirteen reporting years.'
