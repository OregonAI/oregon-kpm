name: publish-index

# Publish this corpus's corpus-index.json to its own GitHub Pages site.
#
# Every corpus owes its siblings this artifact. It maps id -> [title, doc_type, path] with
# no edges, which is how another corpus resolves a citation into this one without reading a
# multi-MB graph.json. The org landing page (https://oregonai.github.io/) reads the same
# file to report live document counts — a corpus that does not publish one renders there
# with a declared status and no counts, however much content it actually holds.
#
# Index only, no landing page. Publishing the index is the platform contract; a human-facing
# site is your corpus's own choice, built by its own src/build_site.py.
#
# ---------------------------------------------------------------------------------------
# TWO THINGS TO DO WHEN YOU INSTANTIATE THIS TEMPLATE
#
# 1. Enable Pages on the new repo with the WORKFLOW builder, not the default:
#        gh api -X PUT repos/<org>/<repo>/pages -f build_type=workflow
#    GitHub auto-enables the legacy Jekyll builder, which fights an Actions deploy.
#
# 2. If your corpus also deploys its own Pages site, DELETE this file and publish
#    corpus-index.json from that workflow instead. Two workflows deploying to one Pages
#    site fight over the `pages` concurrency group.
# ---------------------------------------------------------------------------------------
on:
  push:
    branches: [main]
  # The index derives from the corpus, and a scheduled ingest changes the corpus without
  # touching this workflow — so a push-only trigger lets the published index lag the repo
  # silently. Keep this cadence at least as often as your ingest runs.
  schedule:
    - cron: "40 9 * * 1"
  workflow_dispatch:

# The caller must grant these. A reusable workflow can only REDUCE the caller's
# permissions, never escalate — and this org's default workflow token is read-only, so
# without this block the deploy fails at startup with "requesting 'pages: write', but is
# only allowed 'pages: none'" before any job is created.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    # Inert in the template itself, live in every corpus made from it. The template holds
    # placeholder content and has no Pages site, so running here only ever produces a red
    # X — and a workflow that is always failing is one people learn to ignore. This guard
    # needs no action on instantiation: the repository name stops matching, and the job
    # starts running by itself.
    if: github.repository != 'OregonAI/corpus-template'
    uses: OregonAI/corpus-toolkit/.github/workflows/publish-index.yml@v1.15.0
    with:
      # Pin the CODE, not just the workflow file above. These are separate knobs: `uses:`
      # selects the workflow file, `toolkit-ref` selects the toolkit it installs. Leave
      # this out and you silently run whatever the default happens to be. Bump both
      # together.
      toolkit-ref: v1.15.0
