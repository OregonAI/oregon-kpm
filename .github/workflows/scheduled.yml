name: scheduled
on:
  schedule:
    - cron: "0 14 * * 1"      # weekly Monday: full validation
    - cron: "0 14 1 * *"        # monthly, 1st: drift (corpus-toolkit ADR 0015)
  workflow_dispatch:

jobs:
  # Drift monthly, not weekly: since corpus-toolkit ADR 0015 a run writes DRIFT.md and
  # files nothing, so nobody is waiting on a weekly result, and the full-validation jobs
  # below are what the release canary relies on being green every week.
  drift:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 14 1 * *'
    permissions:
      contents: write
      # v1.30.0 opens a PR for STATUS.md instead of pushing to
      # this protected branch. A CALLER's permissions are the
      # ceiling for a reusable workflow, so the toolkit
      # declaring this is not enough on its own.
      pull-requests: write
    uses: OregonAI/corpus-toolkit/.github/workflows/detect-upstream-changes.yml@v1

  # FULL-CORPUS validation. ci.yml only ever validates files CHANGED in a PR,
  # which leaves two real holes:
  #
  #   1. A document merged before a rule tightened is never re-checked, and a
  #      document whose snapshot is later deleted is never re-detected.
  #   2. On a repository's FIRST push to main, github.event.before is all-zeros,
  #      so the changed-file set is empty and validation passes having checked
  #      nothing. An initial bulk import can land fully green and completely
  #      unvalidated — the single worst moment to not be looking.
  #
  # The toolkit's reusable workflows already branch on github.event_name and run
  # the full corpus for schedule/workflow_dispatch; without these two jobs that
  # branch is dead code in every corpus built from this template.
  full-frontmatter:
    uses: OregonAI/corpus-toolkit/.github/workflows/validate-frontmatter.yml@v1
  full-provenance:
    uses: OregonAI/corpus-toolkit/.github/workflows/verify-provenance.yml@v1

  # oregon-kpm#43 review: _meta/source-manifest.yml is a committed generated file
  # (src/enumerate_kpm.py) and needs a `--check` step SOMEWHERE, same rule ci.yml's
  # `generated` job states for graph.json/STATUS.md/series.json. It runs here, not
  # there -- see the note beside that job's table in ci.yml for why: unlike those
  # three, checking this file means re-verifying ~830 candidate URLs are still live,
  # reachable, public PDFs against oregonlegislature.gov, which is minutes of live
  # network per run, not CPU on already-committed content. Weekly, alongside `drift`
  # above, matches the cost this repo already accepts for that same host and catches
  # the failure mode a per-PR gate cannot: upstream renaming or pulling a document
  # makes this file stale with no file in THIS repo touched, so nothing PR-triggered
  # would ever see it.
  #
  # No --skip-sweep: the sweep cache is gitignored on purpose (a network artifact, not
  # a source of truth) and does not survive between Actions runs, so --skip-sweep
  # would silently no-op into a full sweep here anyway. Run the real thing.
  source-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: source-manifest.yml must be current
        run: python3 src/enumerate_kpm.py --check
