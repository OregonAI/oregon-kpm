name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontmatter:
    uses: OregonAI/corpus-toolkit/.github/workflows/validate-frontmatter.yml@v1.24.0
    with:
      # Pin the CODE, not just the workflow file above — separate knobs.
      toolkit-ref: v1.24.0
  provenance:
    uses: OregonAI/corpus-toolkit/.github/workflows/verify-provenance.yml@v1.24.0
    with:
      # Pin the CODE, not just the workflow file above — separate knobs.
      toolkit-ref: v1.24.0
  links:
    uses: OregonAI/corpus-toolkit/.github/workflows/check-links.yml@v1.24.0
    with:
      # Pin the CODE, not just the workflow file above — separate knobs.
      toolkit-ref: v1.24.0
      # lychee walks './**/*.md'. Without these exclusions it crawls
      # _meta/templates/document.md — a skeleton whose example URLs are not meant
      # to resolve — and every PR fails on link rot that is not link rot.
      # _meta/snapshots/ is excluded because a large corpus's snapshots would drag
      # hundreds of upstream URLs into a per-PR gate; upstream availability is what
      # the scheduled drift job is for.
      # `reports/` is excluded because its links are NOT this repository's links, and
      # because THE CONTENT CANNOT CHANGE.
      #
      # Every document's `## Full text` is verbatim agency text, and an APPR cites URLs
      # throughout. A 2016 report citing a page that died in 2019 is an ACCURATE COPY of a
      # 2016 document, not link rot in this corpus -- and "fixing" one would mean editing
      # quoted text, which AGENTS.md forbids outright. Same reasoning as oregon-audits
      # (measured there: 781 links, 150 errors, every one inside reports/) and
      # federal-reference.
      #
      # The immutability argument is sharper here than in either sibling. A published APPR
      # is a fixed historical record: LFO adds a new reporting year annually and never
      # revises a prior one, which is why this corpus is `recheck: annual`. So re-crawling
      # 229 documents on every PR spends minutes against a host that serves at ~120 KB/s to
      # re-verify links that cannot have changed since the last commit. The first run of
      # this gate took over six minutes before being excluded.
      exclude-paths: |
        _meta/snapshots
        _meta/templates
        reports

  # EVERY COMMITTED GENERATED ARTIFACT MUST BE CURRENT, checked on every PR.
  #
  # This is the gate the toolkit cannot provide for you. It only READS
  # _meta/graph.json, so nothing upstream notices when a document is added and the
  # graph is not rebuilt — resolve_citation and graph_neighbors simply stop finding
  # it, silently, with no error anywhere.
  #
  # What this corpus commits, and what covers it:
  #
  #   _meta/graph.json   src/build_graph.py         this job, every PR
  #   STATUS.md          corpus-generate-status     this job, every PR
  #
  # STATUS.md is also regenerated and committed by the weekly `drift` job in
  # scheduled.yml. That is a repair, not a gate: between Mondays a PR can merge a
  # document and leave the published status wrong for six days with nothing saying so.
  #
  # _meta/corpus-index.json is deliberately ABSENT from this list. The platform builds
  # it at deploy time in publish-index.yml and never commits it, precisely so it cannot
  # fall behind its own corpus in a way that damages a SIBLING repo's citation
  # resolution. Do not commit one and then gate it here; publish it instead.
  #
  # ADD A STEP HERE FOR EVERY GENERATED FILE YOU COMMIT. A generated file with no step
  # is the failure this whole job exists to prevent, and it is silent by construction.
  #
  # Note the checks are `--check` rather than `git diff --exit-code`: STATUS.md carries
  # a "Generated <date>" line, so a raw diff would fail every day for a reason that is
  # not drift. Both `--check` implementations compare CONTENT and print the exact
  # command to re-run.
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # THIRD PIN, and yes that is one more than there should be. `uses:` above selects
      # the workflow file, `toolkit-ref:` selects the code it installs, and this selects
      # the code THIS job installs. All three must move together; a bump that misses one
      # runs new checks against old code. Tracked as corpus-toolkit#9.
      - uses: actions/checkout@v4
        with:
          repository: OregonAI/corpus-toolkit
          ref: v1.24.0
          path: .toolkit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./.toolkit
      - name: Authority graph must be current
        run: python3 src/build_graph.py --check
      - name: STATUS.md must be current
        run: corpus-generate-status --config _meta/corpus.yml --output STATUS.md --check
      # _meta/series.json is derived from the committed report text, so it falls behind the
      # moment a document is added or re-ingested -- and nothing else would notice. The
      # series is what an agent actually queries; a stale one answers with numbers that no
      # longer match the documents they cite, which is wrong in the most credible-looking
      # way available.
      - name: Derived KPM series must be current
        run: python3 src/build_series.py --check
      # The rules AGENTS.md states that no schema can express: a reporting year must carry
      # where it came from, proposed-vs-approved must be explicit, every body must say the
      # numbers are the agency's own claim, and nothing may publish a green/yellow/red
      # assessment we computed ourselves. That last one is the most tempting field to add
      # here and the one that would most convincingly misrepresent the source.
      - name: Corpus guardrails
        run: python3 src/check_guardrails.py
      # Every agency must have a recorded decision about its counterpart in the
      # executive-regulatory-frameworks registry -- mapped, or absent with a stated reason.
      # Without this a new agency arrives silently unmapped and the crosswalk degrades by
      # omission rather than by anything anyone can see.
      #
      # Runs WITHOUT a sibling checkout on purpose. Referential integrity against ERF
      # (--verify-registry) needs that repo and is a local/review step, the same split
      # oregon-budget's build_joins.py makes: what CI verifies must be verifiable from what
      # is committed here.
      - name: Agency registry crosswalk must be complete
        run: python3 src/link_agency_registry.py --check
